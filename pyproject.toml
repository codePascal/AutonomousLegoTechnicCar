[tool.poetry]
name = "autonomouslegotechniccar"
version = "0.1.0"
description = "A Python project to enable autonomous driving on a LegoTechnic car"
authors = ["Pascal Müller <mup0117@gmail.com>"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
numpy = "^2.5.1"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.0,<0.17.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
